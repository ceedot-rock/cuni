name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Go (conformance suite runs go run)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Node (conformance suite runs node)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      # Keep the product surface green even if someone skips the Exactness workflow.
      - name: Exactness gate (cuni check)
        run: |
          cargo build --release
          ./target/release/cuni check --timeout 120 \
            examples/full.cuni \
            examples/structs.cuni \
            examples/enums.cuni
