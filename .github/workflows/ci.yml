name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Go (conformance suite runs go run)
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"

      - name: Go toolchain smoke (fail fast if go is not on PATH)
        run: go version

      - name: Install Node (conformance suite runs node)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Node toolchain smoke
        run: node --version

      - name: Install Lua 5.4 (native lua seat runs as lua5.4)
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Install solc 0.8.28 (proof_crosschain compiles real bytecode)
        run: |
          curl -sSL -o /tmp/solc https://github.com/ethereum/solidity/releases/download/v0.8.28/solc-static-linux
          chmod +x /tmp/solc
          sudo mv /tmp/solc /usr/local/bin/solc
          solc --version

      - name: Install deferred-seat toolchains (clojure, elixir+escript, swipl)
        run: |
          sudo apt-get update && sudo apt-get install -y clojure elixir swi-prolog
          clojure --version && elixir --version && escript -e 'io:format("escript ok~n").' && swipl --version

      - name: Build
        run: cargo build --verbose

      - name: Bank hook must exist
        run: |
          ./target/debug/cuni bank --help
          ./target/debug/cuni bank paste examples/bank/add.py --from py --to py


      - name: Studio citizen PASS shape smoke
        run: python3 -m unittest playground.test_citizen_pass -v

      - name: Test
        run: cargo test --verbose
