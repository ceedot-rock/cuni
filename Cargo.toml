[package]
name = "cuni"
version = "0.1.10"
edition = "2021"
description = "CuNi (Code:uNiTY) — emit every coding language; exactness gate runs the full catalog"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ceedot-rock/cuni"
homepage = "https://cuni-studio.fly.dev/"
documentation = "https://github.com/ceedot-rock/cuni/blob/master/SPEC.md"
readme = "README.md"
keywords = ["compiler", "transpiler", "multi-target", "python", "golang", "agentic", "mcp", "agent-rider"]
categories = ["compilers", "development-tools"]

[lib]
name = "cuni"
path = "src/lib.rs"

[[bin]]
name = "cuni"
path = "src/main.rs"

[package.metadata.agentic]
discovery = "https://cuni-studio.fly.dev/agents.json"
studio = "https://cuni-studio.fly.dev/"
protocol = "https://cuni-studio.fly.dev/.well-known/cuni-protocol.json"
agent_rider = "https://agentrider.fly.dev/.well-known/agent.json"
mcp = "https://agentrider.fly.dev/api/mcp"
lab_commerce = "https://www.slidphilabs.com/api/agent"
one_liner = "CuNi Protocol https://cuni-studio.fly.dev/.well-known/cuni-protocol.json · Studio https://cuni-studio.fly.dev/ · Agent^Rider https://agentrider.fly.dev/.well-known/agent.json · Lab commerce https://www.slidphilabs.com/api/agent"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/cuni-{ version }-{ target }.tar.gz"
bin-dir = "{ bin }"
pkg-fmt = "tgz"
